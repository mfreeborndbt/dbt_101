version: 2

models:
  - name: monthly_gross_revenue
    description: >
      Monthly aggregated revenue and profitability metrics.
      This mart provides executive-level reporting on revenue, costs, and margins
      broken down by time period, geography, and market segment. Used for monthly
      business reviews and financial reporting.
    columns:
      - name: order_month
        description: First day of the month for the aggregation period (primary key part)
        tests:
          - not_null
      - name: region_name
        description: Geographic region (primary key part)
        tests:
          - not_null
      - name: nation_name
        description: Nation within the region (primary key part)
        tests:
          - not_null
      - name: market_segment
        description: Customer market segment (primary key part)
        tests:
          - not_null
      - name: total_orders
        description: Count of distinct orders in the period
        tests:
          - not_null
      - name: total_customers
        description: Count of distinct customers who ordered in the period
        tests:
          - not_null
      - name: total_line_items
        description: Count of line items ordered in the period
        tests:
          - not_null
      - name: gross_revenue
        description: Total revenue before any discounts or taxes
        tests:
          - not_null
      - name: discounted_revenue
        description: Revenue after discounts but before taxes
        tests:
          - not_null
      - name: net_sales
        description: Final revenue after discounts and taxes
        tests:
          - not_null
      - name: total_supply_cost
        description: Total cost of goods sold (supply costs)
        tests:
          - not_null
      - name: gross_profit
        description: Total gross profit (net_sales - total_supply_cost)
        tests:
          - not_null
      - name: avg_discount_rate
        description: Average discount rate applied during the period
      - name: avg_quantity
        description: Average quantity per line item
      - name: avg_line_item_sales
        description: Average net sales per line item
      - name: gross_margin
        description: Gross profit margin percentage (gross_profit / net_sales)
    tests:
      - unique:
          column_name: "order_month || '-' || region_name || '-' || nation_name || '-' || market_segment"

