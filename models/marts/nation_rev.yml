models:
- name: nation_rev
  description: This model calculates the total revenue for each nation by summing
    up the final revenue from customer orders. It provides insights into the revenue
    distribution across different nations, which can be useful for market analysis
    and strategic planning.
  columns:
  - name: market_segment
    description: The market segment associated with the nation.
  - name: nation_name
    description: The name of the nation for which the revenue is calculated.
  - name: total_revenue
    description: The total revenue generated by the nation, calculated as the sum
      of final revenues from customer orders.
