version: 2

models:
  - name: int_dim_customers
    description: >
      Customer dimension table enriched with geographic hierarchy.
      Joins customers with their nation and region information to create
      a complete customer dimension for analytics.
    columns:
      - name: customer_key
        description: Unique identifier for each customer (primary key)
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Name of the customer
        tests:
          - not_null
      - name: customer_address
        description: Customer's mailing address
      - name: phone_number
        description: Customer's phone number
      - name: account_balance
        description: Customer's current account balance
      - name: market_segment
        description: Market segment classification
        tests:
          - not_null
      - name: nation_key
        description: Foreign key to nation
        tests:
          - not_null
      - name: nation_name
        description: Name of the customer's nation
        tests:
          - not_null
      - name: region_key
        description: Foreign key to region
        tests:
          - not_null
      - name: region_name
        description: Name of the customer's region
        tests:
          - not_null

  - name: order_items
    description: >
      Order line items enriched with customer dimension.
      Combines order and line item details with customer geographic and
      segment information. Includes calculated pricing fields.
    columns:
      - name: order_key
        description: Order identifier (part of composite key)
        tests:
          - not_null
      - name: line_number
        description: Line item number within order (part of composite key)
        tests:
          - not_null
      - name: customer_key
        description: Foreign key to customer dimension
        tests:
          - not_null
          - relationships:
              config:
                where: "customer_key is not null"
              arguments:
                to: ref('int_dim_customers')
                field: customer_key
      - name: part_key
        description: Foreign key to part
        tests:
          - not_null
      - name: supplier_key
        description: Foreign key to supplier
        tests:
          - not_null
      - name: order_status
        description: Current status of the order
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['F', 'O', 'P']
      - name: order_total_price
        description: Total price of the entire order
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null
      - name: order_priority
        description: Priority classification of the order
      - name: clerk
        description: Clerk who processed the order
      - name: ship_priority
        description: Shipping priority level
      - name: quantity
        description: Quantity ordered for this line item
        tests:
          - not_null
      - name: extended_price
        description: Extended price before discounts and taxes
        tests:
          - not_null
      - name: discount
        description: Discount rate applied (0-1)
      - name: tax
        description: Tax rate applied (0-1)
      - name: return_flag
        description: Return status indicator
      - name: line_status
        description: Line item fulfillment status
      - name: ship_date
        description: Date item was shipped
      - name: commit_date
        description: Committed delivery date
      - name: receipt_date
        description: Date item was received
      - name: ship_mode
        description: Shipping method used
      - name: customer_name
        description: Name of the customer (from dimension)
      - name: nation_key
        description: Customer's nation key
      - name: nation_name
        description: Customer's nation name
      - name: region_key
        description: Customer's region key
      - name: region_name
        description: Customer's region name
      - name: market_segment
        description: Customer's market segment
      - name: discounted_price
        description: Price after discount applied (extended_price * (1 - discount))
        tests:
          - not_null
      - name: net_item_sales
        description: Final price after discount and tax (discounted_price * (1 + tax))
        tests:
          - not_null
    tests:
      - unique:
          column_name: "order_key || '-' || line_number"

  - name: fct_order_items
    description: >
      Fact table for order line items with complete part and supplier details.
      This is the primary fact table combining all order, customer, part, and
      supplier information with calculated profitability metrics.
    columns:
      - name: order_key
        description: Order identifier (part of composite key)
        tests:
          - not_null
      - name: line_number
        description: Line item number within order (part of composite key)
        tests:
          - not_null
      - name: customer_key
        description: Foreign key to customer dimension
        tests:
          - not_null
      - name: part_key
        description: Foreign key to part
        tests:
          - not_null
      - name: supplier_key
        description: Foreign key to supplier
        tests:
          - not_null
      - name: order_status
        description: Current status of the order
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['F', 'O', 'P']
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null
      - name: order_priority
        description: Priority classification of the order
      - name: clerk
        description: Clerk who processed the order
      - name: ship_priority
        description: Shipping priority level
      - name: quantity
        description: Quantity ordered
        tests:
          - not_null
      - name: extended_price
        description: Extended price before discounts and taxes
        tests:
          - not_null
      - name: discount
        description: Discount rate applied
      - name: tax
        description: Tax rate applied
      - name: return_flag
        description: Return status indicator
      - name: line_status
        description: Line item fulfillment status
      - name: ship_date
        description: Date item was shipped
      - name: commit_date
        description: Committed delivery date
      - name: receipt_date
        description: Date item was received
      - name: ship_mode
        description: Shipping method used
      - name: discounted_price
        description: Price after discount
        tests:
          - not_null
      - name: net_item_sales
        description: Final sales amount after discount and tax
        tests:
          - not_null
      - name: customer_name
        description: Customer name from dimension
      - name: nation_key
        description: Customer's nation key
      - name: nation_name
        description: Customer's nation name
      - name: region_key
        description: Customer's region key
      - name: region_name
        description: Customer's region name
      - name: market_segment
        description: Customer's market segment
      - name: part_name
        description: Name/description of the part
      - name: manufacturer
        description: Part manufacturer
      - name: brand
        description: Part brand
      - name: part_type
        description: Type classification of the part
      - name: part_size
        description: Size of the part
      - name: container
        description: Container type for the part
      - name: retail_price
        description: Retail price of the part
      - name: available_quantity
        description: Available quantity from supplier
      - name: supply_cost
        description: Cost to purchase from supplier
        tests:
          - not_null
      - name: total_supply_cost
        description: Total supply cost for this line (quantity * supply_cost)
        tests:
          - not_null
      - name: gross_profit
        description: Gross profit for this line (net_item_sales - total_supply_cost)
        tests:
          - not_null
    tests:
      - unique:
          column_name: "order_key || '-' || line_number"

